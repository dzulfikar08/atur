[workspace]
members = [
    "crates/server",
    "crates/domain",
    "crates/db",
    "crates/tasks",
    "crates/collab",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "timeout", "limit", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Password hashing
argon2 = "0.5"

# Session
tower-sessions = "0.14"
tower-sessions-core = "0.14"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Template engine
askama = "0.12"

# Search
tantivy = "0.22"

# Y.js (Rust)
yrs = "0.21"

# Task queue
apalis = { version = "0.7", features = ["limit", "retry"] }

# HTTP client (for webhooks, OAuth)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# CSV parsing
csv = "1.3"

# URL encoding
urlencoding = "2"

# Multipart file uploads
multer = "3"

# MCP (Model Context Protocol)
rmcp = { version = "1.7", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# CLI
clap = { version = "4", features = ["derive"] }
