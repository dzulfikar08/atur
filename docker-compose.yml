# ===========================================================================
# Plane PMO - Docker Compose
# ===========================================================================
# Usage:
#   Development (SQLite):
#     docker compose --profile dev up --build
#
#   Production (SQLite):
#     docker compose --profile prod up -d --build
#
#   Production (PostgreSQL):
#     docker compose --profile prod up -d --build
#     # Then set database.url in config.toml to: postgres://plane:plane@postgres:5432/planepmo
# ===========================================================================

services:
  # ---------------------------------------------------------------------------
  # Server (main application)
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PLANE_PORT:-8080}:8080"
    volumes:
      - plane-data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    profiles:
      - prod
    depends_on: {}

  # ---------------------------------------------------------------------------
  # Development server (with source mount for rebuilding)
  # ---------------------------------------------------------------------------
  server-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PLANE_PORT:-8080}:8080"
    volumes:
      - plane-data:/app/data
      - ./config.toml:/app/config.toml:ro
      # Mount static dirs for live frontend updates
      - ./static:/app/static:ro
      - ./static-editor:/app/static-editor:ro
    environment:
      - RUST_LOG=${RUST_LOG:-debug}
    restart: unless-stopped
    profiles:
      - dev

  # ---------------------------------------------------------------------------
  # PostgreSQL (optional, for production use)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-planepmo}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    profiles:
      - prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  plane-data:
    driver: local
  pg-data:
    driver: local
