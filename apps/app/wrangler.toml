name = "atur-hono"
main = "src/worker/index.ts"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]
account_id = "b7e6f8457bd39fa37a7eea5249799754"

# 2026-08-17: app split. The marketing site (Astro) owns diatur.com; the app
# worker owns app.diatur.com.
[[routes]]
pattern = "app.diatur.com/*"
zone_id = "85af83477a97625830e3a172e1d04aed"

[[d1_databases]]
binding = "DB"
database_name = "atur-db"
database_id = "08a18888-5e9a-4384-8ec2-03e73adab633"

[[r2_buckets]]
binding = "R2"
bucket_name = "atur-assets"

# Daily D1 → R2 backups (services/backup.ts): dump + prune, bucket atur-backups.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "atur-backups"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "767d9b9dfa0e4f79a70f7f3c3e205f69"

# Outbound email for the support portal OTP. verified_address must be an address
# you've verified in the Cloudflare dashboard (Email → Routing → Settings).
# Set EMAIL_FROM to the same bare address (var below, or `wrangler secret`),
# e.g. `wrangler secret put EMAIL_FROM` → noreply@diatur.com.
[[send_email]]
name = "SEND_EMAIL"
verified_address = "noreply@diatur.com"

# Google OAuth ("Continue with Google"): GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET
# are secrets (not vars) — see docs/DEPLOY.md. Registered redirect URIs must be
# https://app.diatur.com/auth/google/callback and
# http://localhost:5173/auth/google/callback (vite dev).

# Herdr execution-plane bridge (ATUR-2): HERDR_BRIDGE_URL + HERDR_BRIDGE_TOKEN
# are secrets (not vars) — see docs/DEPLOY.md and .dev.vars.example locally.
# URL is http://127.0.0.1:7601 in dev or the https:// tunnel hostname in prod;
# token is the bridge's optional x-bridge-token shared secret.

[observability]
enabled = true

# Daily 08:00 UTC cron → scheduled() sends due-date reminder emails to issue
# followers. Daily 03:30 UTC cron → D1 dump to R2 (services/backup.ts). Hourly
# :15 cron → GC of unclaimed widget/native uploads (2h TTL).
[triggers]
crons = ["0 8 * * *", "30 3 * * *", "15 * * * *", "*/10 * * * *"]

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
# index.ts routes non-API requests to ASSETS (SPA fallback). With the vite
# cloudflare plugin the client build lands in dist/client.
run_worker_first = true

# Polar (payments → CRM import): credentials are per-workspace and entered in
# the app UI (Integrations → Polar), stored in the polar_settings table — NOT
# worker secrets. Webhook endpoint: /webhooks/polar/:slug (signed, per-workspace).
