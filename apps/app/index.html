<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The PWA service worker was removed (it served stale precached HTML and
      // swallowed the Google OAuth redirect back). Browsers keep a registered
      // SW until an update check sees the gone script, so actively unregister
      // it and drop its precache. Safe no-op for never-PWA clients.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ("caches" in window) {
        caches.keys().then(function (keys) {
          for (var k of keys) caches.delete(k);
        });
      }
    </script>
    <script>
      // Resolve the theme before first paint so the boot splash (and the app
      // behind it) never flashes light for dark users. Mirrors applyTheme() in
      // src/client/stores/theme.ts, which re-applies once the bundle runs.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.setAttribute("data-mode", dark ? "dark" : "light");
      })();
    </script>
    <style>
      /* Boot splash + shared loader styles. Inline because the splash paints
         before the bundle's CSS exists; components/AppLoader.tsx reuses these
         classes so every loading state is the same design. Colors mirror the
         --background / --foreground / --muted-foreground / --border tokens in
         src/client/index.css. */
      :root {
        --boot-bg: oklch(0.984 0 0);
        --boot-fg: oklch(0.16 0 0);
        --boot-muted: oklch(0.51 0 0);
        --boot-track: oklch(0.91 0 0);
      }
      :root.dark {
        --boot-bg: oklch(0.155 0 0);
        --boot-fg: oklch(0.97 0 0);
        --boot-muted: oklch(0.68 0 0);
        --boot-track: oklch(1 0 0 / 12%);
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        color: var(--boot-fg);
        font-family: "Manrope Variable", ui-sans-serif, system-ui, sans-serif;
      }
      .boot--screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--boot-bg);
        transition: opacity 180ms ease-out;
      }
      .boot--screen[hidden] {
        display: none;
      }
      .boot--leaving {
        opacity: 0;
        pointer-events: none;
      }
      .boot--content {
        min-height: 40vh;
      }
      /* Content waits a beat before appearing so fast loads never flash. The
         background does not fade: it must cover the page from the first frame. */
      .boot > * {
        animation: boot-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) var(--boot-enter, 150ms) both;
      }
      .boot-mark {
        display: block;
        width: 44px;
        height: 44px;
        fill: currentColor;
      }
      .boot-progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .boot-bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--boot-track);
      }
      .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: currentColor;
        animation: boot-sweep 1400ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-label {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
        color: var(--boot-muted);
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes boot-breathe {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot > * {
          animation-name: none;
        }
        .boot-bar::after {
          width: 100%;
          animation: boot-breathe 1200ms ease-in-out infinite alternate;
        }
      }
    </style>
