# Android release build for Atur on GitHub Actions: the Play AAB (apps/native/dist/atur-play-<versionCode>.aab) and/or
# the sideload site APK (apps/native/dist/atur-release.apk), both from scripts/build-native-apk.sh.
#
# Manual only (Actions tab -> "Release Android" -> Run workflow). Nothing runs on push or pull request. The job is
# bound to the `release` environment, which holds the signing secrets and is limited to
# master and v* tags. Setup: docs/ci-release.md.
#
# Uploads are off by default. The first upload to a new Play app may have to be play_status=draft.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [play-aab, site-apk, both]
        default: play-aab
      play_track:
        description: "Upload the AAB to this Play track (none = artifact only)"
        type: choice
        options: [none, internal, alpha, beta]
        default: none
      play_status:
        description: "Release status when uploading (draft = review it in Play Console first)"
        type: choice
        options: [draft, completed]
        default: draft
      publish_site_apk:
        description: "Upload the site APK to R2 (atur-assets/downloads/atur-latest.apk); needs CLOUDFLARE_API_TOKEN"
        type: boolean
        default: false
  # To also build on version tags, uncomment. The `release` environment approval still applies.
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: release
    env:
      TARGET: ${{ inputs.target || 'play-aab' }}
      PLAY_TRACK: ${{ inputs.play_track || 'none' }}
      PLAY_STATUS: ${{ inputs.play_status || 'draft' }}
      PUBLISH_SITE_APK: ${{ inputs.publish_site_apk && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          if [ "$PLAY_TRACK" != none ] && [ "$TARGET" = site-apk ]; then
            echo "play_track needs target play-aab or both" >&2; exit 1
          fi
          if [ "$PUBLISH_SITE_APK" = 1 ] && [ "$TARGET" = play-aab ]; then
            echo "publish_site_apk needs target site-apk or both" >&2; exit 1
          fi

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/.cache "$AGENT_TOOLSDIRECTORY/CodeQL"

      # JAVA_HOME from setup-java and ANDROID_HOME from the runner image are what build-native-apk.sh reads.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Caches ~/.gradle. The Gradle project is generated by `expo prebuild` in the script.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # The template's 2 GB heap runs out of memory in R8 on a release build.
      - name: Gradle JVM settings
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same files apps/native/keystore holds on the laptop. build.gradle resolves storeFile as written, so the
      # path is absolute; the script only generates a keystore when the file is missing.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p apps/native/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > apps/native/keystore/atur-release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/apps/native/keystore/atur-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/native/keystore/keystore.properties

      # The script's manifest guard needs bundletool for the AAB (default path ~/.cache/bundletool/bundletool.jar).
      - name: Install bundletool
        if: env.TARGET != 'site-apk'
        run: |
          mkdir -p ~/.cache/bundletool
          curl -fsSL -o ~/.cache/bundletool/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      # Play AAB first, then the site APK: each run re-runs prebuild because the distribution flag is part of its hash.
      - name: Build Play AAB
        if: env.TARGET != 'site-apk'
        run: |
          scripts/build-native-apk.sh --play
          mkdir -p apps/native/dist
          cp apps/native/android/app/build/outputs/mapping/release/mapping.txt apps/native/dist/mapping-play.txt

      # Play-only manifest rules on top of the script's guard (docs/play-store.md): no SMS/call log/contacts, no ad ID.
      - name: Guard Play manifest permissions
        if: env.TARGET != 'site-apk'
        run: |
          manifest="$(java -jar ~/.cache/bundletool/bundletool.jar dump manifest --bundle apps/native/dist/atur-play-*.aab)"
          if grep -E 'android.permission.(REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|SEND_SMS|READ_SMS|RECEIVE_SMS|READ_CALL_LOG|READ_CONTACTS)"|gms.permission.AD_ID"' <<<"$manifest"; then
            echo "Play AAB declares a forbidden permission" >&2
            exit 1
          fi
          echo "Permissions in the Play AAB:"
          grep -o 'android:name="[^"]*"' <<<"$(grep -E '<uses-permission' <<<"$manifest")" | cut -d'"' -f2 | sort

      # CLOUDFLARE_API_TOKEN is only exposed to the publish step; without it the publish is skipped.
      - name: Build site APK
        if: env.TARGET != 'play-aab'
        run: scripts/build-native-apk.sh

      - name: Publish site APK to R2
        if: env.TARGET != 'play-aab' && env.PUBLISH_SITE_APK == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set in environment release: site APK not published" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd apps/app
          bunx wrangler r2 object put atur-assets/downloads/atur-latest.apk --remote \
            --file "$GITHUB_WORKSPACE/apps/native/dist/atur-release.apk" \
            --content-type application/vnd.android.package-archive
          echo "published: https://app.diatur.com/public/downloads/android" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        run: |
          for f in apps/native/dist/*.aab apps/native/dist/*.apk apps/native/dist/mapping-play.txt; do
            [ -f "$f" ] || continue
            ls -la "$f"; sha256sum "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atur-android-${{ github.run_number }}
          path: |
            apps/native/dist/*.aab
            apps/native/dist/*.apk
            apps/native/dist/mapping-play.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.diatur.app
          releaseFiles: apps/native/dist/atur-play-*.aab
          mappingFile: apps/native/dist/mapping-play.txt
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}

      - name: Remove signing material
        if: always()
        run: rm -rf apps/native/keystore
