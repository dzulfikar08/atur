# atur-bridge release: single-file binaries for linux/macOS (x64 and arm64), attached to a GitHub Release.
#
# Runs on tags `bridge-v*` (git tag bridge-v0.1.0 && git push origin bridge-v0.1.0). The tag must match
# apps/bridge/package.json "version", because the binary reports that version. Bun cross-compiles, so one
# ubuntu job builds every target. The installer (apps/web/public/install-bridge.sh) downloads the assets
# and checks them against SHA256SUMS. Docs: docs/bridge.md.
name: Release bridge

on:
  push:
    tags: ["bridge-v*"]

permissions:
  contents: read

concurrency:
  group: release-bridge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Creating the Release needs write access; the checkout above does not.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./apps/bridge/package.json").version)')
          if [ "$TAG" != "bridge-v$version" ]; then
            echo "tag $TAG does not match apps/bridge/package.json version $version (expected bridge-v$version)" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Typecheck and test
        working-directory: apps/bridge
        run: |
          bun run typecheck
          bun test

      - name: Build binaries
        working-directory: apps/bridge
        run: sh scripts/build-binaries.sh

      - name: Smoke test the linux-x64 binary
        working-directory: apps/bridge
        run: |
          version=$(./dist/atur-bridge-linux-x64 --version)
          test "$TAG" = "bridge-v$version"

      - name: Publish release
        working-directory: apps/bridge/dist
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$TAG" atur-bridge-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "atur-bridge ${TAG#bridge-v}" \
            --generate-notes
