name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      # Fail on high/critical advisories; moderate ones are reported without
      # breaking the build (bun audit exits 0 for moderate).
      # node-forge, undici and zod are overridden to fixed releases in package.json: miniflare pins a
      # vulnerable undici, and @expo/cli pins zod 3 (all of 3.x is affected by GHSA-mrhx-c7xc-m3w5;
      # its schemas only use APIs zod 4 keeps).
      - run: bun audit --audit-level=high
      - run: bun run test
      - run: bun --filter @atur/app build
      - run: bun --filter @atur/web build
